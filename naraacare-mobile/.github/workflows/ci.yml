name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1 (checksum verified)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
      - run: gitleaks git --redact --verbose --config .gitleaks.toml .

  analyze-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Generated code is up to date (l10n, drift)
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/core/l10n/generated 'lib/**/*.g.dart'
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze (very_good_analysis)
        run: flutter analyze --fatal-infos
      - name: Tests (incl. source security rules + payload list)
        run: flutter test --dart-define-from-file=env/test.env --coverage
      - name: Dependency report
        run: flutter pub outdated --no-dev-dependencies --show-all || true

  osv-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: OSV-Scanner 2.7.0 on pubspec.lock (checksum verified)
        run: |
          curl -sSfL -o /tmp/osv https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  /tmp/osv" | sha256sum -c -
          chmod +x /tmp/osv
          /tmp/osv scan source --lockfile=pubspec.lock

  build-android:
    runs-on: ubuntu-24.04
    needs: analyze-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build dev flavor APK
        run: flutter build apk --flavor dev -t lib/main_dev.dart --debug --dart-define-from-file=env/test.env
      - name: Verify the three flavors have distinct application IDs
        run: |
          grep -q 'applicationIdSuffix = ".dev"' android/app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".staging"' android/app/build.gradle.kts
          grep -q 'applicationId = "com.naraacare.app"' android/app/build.gradle.kts

  build-ios:
    # macOS minutes are ~10x Linux: compile check on main only.
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    needs: analyze-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build iOS (no codesign)
        # Switch to `--flavor dev` once tool/ios/setup_flavors.rb has been run and committed.
        run: flutter build ios --debug --no-codesign -t lib/main_dev.dart --dart-define-from-file=env/test.env
