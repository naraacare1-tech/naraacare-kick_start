name: naraacare
description: "NaraaCare mobile app"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  # Exact pins (doc 03 §2). Feature packages are added, at the doc 03 versions,
  # in the session that first uses them.
  connectivity_plus: 7.3.2
  crypto: 3.0.8
  cupertino_icons: 1.0.9
  dio: 5.11.1
  drift: 2.35.3
  flutter:
    sdk: flutter
  flutter_jailbreak_detection: 1.10.0
  flutter_local_notifications: 22.3.3  # local reminders (doc 03 pin); BSD-3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  freezed_annotation: 3.1.0
  go_router: 18.1.1
  google_sign_in: 7.2.0
  image_picker: 1.2.4  # S14: optional screenshot for Report a problem
  in_app_purchase: 3.3.1
  intl: 0.20.3
  json_annotation: 4.12.0
  local_auth: 3.0.2
  lottie: 3.8.2  # splash animation (owner, assets/brand/splash.json); MIT
  mobile_scanner: 7.4.2
  path: 1.9.1
  path_provider: 2.1.6
  riverpod_annotation: 4.0.7
  screen_protector: 1.5.3
  share_plus: 13.3.1  # S14: system share sheet for downloaded reports (owner decision)
  sign_in_with_apple: 8.2.0
  speech_to_text: 7.5.0
  sqlite3: 3.8.0
  timezone: 0.11.2  # scheduling in the user's IANA timezone; BSD-2
  unorm_dart: 0.3.3
  url_launcher: 6.3.3
  uuid: 4.6.0

dev_dependencies:
  build_runner: 2.16.2
  drift_dev: 2.35.2
  flutter_launcher_icons: 0.14.4  # app icon generator (dev-only, not shipped); MIT
  flutter_test:
    sdk: flutter
  freezed: 4.0.3
  integration_test:
    sdk: flutter
  json_serializable: 6.15.2
  mocktail: 1.0.5
  riverpod_generator: 4.0.9
  very_good_analysis: 11.0.0

flutter:
  uses-material-design: true
  # ARB files in lib/core/l10n -> lib/core/l10n/generated (see l10n.yaml).
  generate: true
  assets:
    - assets/brand/
    - assets/avatars/
    - assets/illustrations/
  fonts:
    # Manrope (OQ-57), SIL Open Font License 1.1 (assets/fonts/manrope/OFL.txt). Static weights
    # generated from the Google Fonts variable font with fontTools (see README).
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/manrope/Manrope-Bold.ttf
          weight: 700

hooks:
  user_defines:
    sqlite3:
      # Encrypted local database (doc 07 SEC-5.9): package:sqlite3 bundles the SQLCipher community
      # build, downloaded from its GitHub release and checked against sha256 hashes in the package.
      source: sqlcipher
