# Who may call each route (doc 07 SEC-1.5, Session 16). PRODUCT REVIEW: confirm every row.
# test_authz_matrix.py fails when a route is missing here or a row no longer matches a route.
#
#   access: public            no token needed
#           user              any signed-in user (no token -> 401)
#           "staff:<r1> <r2>" staff role AND an address in STAFF_IP_ALLOWLIST (anything else -> 404)
#   star:   <feature>         STANDARD users get 403 UPGRADE_REQUIRED (the entitlement feature)
#   note:   why a row is unusual
#
# Object ownership (another user's id -> 404) is tested per id route in test_idor_all_ids.py.
