# Install once: uv run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^tests/security/payloads/
      - id: trailing-whitespace
        exclude: ^tests/security/payloads/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: payload-list-fresh
        name: payload list is regenerated
        entry: uv run python tools/build_payloads.py --check
        language: system
        files: ^(tests/security/payloads/|tools/build_payloads\.py)
        pass_filenames: false
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy app tests tools
        language: system
        types: [python]
        pass_filenames: false
